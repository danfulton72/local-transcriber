name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      RECORDINGS_DIR: /tmp/local-transcriber-recordings
      GATEWAY_BASE_URL: http://127.0.0.1:8555/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e '.[test]'
      - run: rm -f test.db && alembic upgrade head
      - run: pytest -q
      - run: node --check app/static/audio-utils.js
      - run: node --check app/static/app.js
      - run: node tests/test_audio_utils.js
      - run: node --check app/static/sw.js
      - run: python -m json.tool app/static/manifest.webmanifest > /dev/null
      - run: python -m compileall -q app migrations speaker_service deploy/ai-stack deploy/voice-stack
      - run: cp .env.example .env && docker compose config -q
      - name: Validate AI-stack integration overlay
        run: |
          mkdir -p "$PWD/runtime" "$PWD/recordings" /tmp/models/talk-to-type/pyannote
          rm -rf /tmp/ai/local-transcriber
          mkdir -p /tmp/ai
          ln -s "$PWD" /tmp/ai/local-transcriber
          AI_HOME=/tmp/ai \
          MODELS_DIR=/tmp/models \
          LOCAL_TRANSCRIBER_DIR=/tmp/ai/local-transcriber \
          T4_UUID=GPU-test \
          LLAMA_SWAP_KEY=sk-local \
          docker compose \
            -f tests/fixtures/ai-stack-base.yml \
            -f deploy/ai-stack/compose.override.yml \
            config -q
      - name: Validate voice-stack P4 integration overlay
        run: |
          mkdir -p "$PWD/recordings" /tmp/voice/speaker-model-cache
          rm -rf /tmp/voice/local-transcriber
          mkdir -p /tmp/voice
          ln -s "$PWD" /tmp/voice/local-transcriber
          P4_UUID=GPU-test \
          LOCAL_TRANSCRIBER_DIR=/tmp/voice/local-transcriber \
          VOICE_SPEAKER_MODELS_DIR=/tmp/voice/speaker-model-cache \
          docker compose \
            -f tests/fixtures/voice-stack-base.yml \
            -f deploy/voice-stack/compose.override.yml \
            config -q
      - run: docker build -t local-transcriber-ci .
      - name: Validate app image migrations
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/container-migration.db \
            local-transcriber-ci \
            sh -lc 'python -c "import greenlet, sqlalchemy.ext.asyncio; print(greenlet.__version__)" && alembic upgrade head && alembic current'
      - run: docker build -t local-transcriber-speaker-ci speaker_service

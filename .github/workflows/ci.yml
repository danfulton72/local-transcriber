name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      RECORDINGS_DIR: /tmp/local-transcriber-recordings
      GATEWAY_BASE_URL: http://127.0.0.1:8555/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e '.[test]'
      - run: rm -f test.db && alembic upgrade head
      - run: pytest -q
      - run: node --check app/static/audio-utils.js
      - run: node --check app/static/app.js
      - run: node tests/test_audio_utils.js
      - run: node --check app/static/sw.js
      - run: python -m json.tool app/static/manifest.webmanifest > /dev/null
      - run: python -m compileall -q app migrations
      - run: docker build -t local-transcriber-ci .

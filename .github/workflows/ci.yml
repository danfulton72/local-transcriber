name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      RECORDINGS_DIR: /tmp/local-transcriber-recordings
      GATEWAY_BASE_URL: http://127.0.0.1:8555/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e '.[test]'
      - run: rm -f test.db && alembic upgrade head
      - run: pytest -q
      - run: node --check app/static/audio-utils.js
      - run: node --check app/static/app.js
      - run: node tests/test_audio_utils.js
      - run: node --check app/static/sw.js
      - run: python -m json.tool app/static/manifest.webmanifest > /dev/null
      - run: python -m compileall -q app migrations speaker_service deploy/ai-stack
      - run: cp .env.example .env && docker compose config -q
      - name: Validate AI-stack integration overlay
        run: |
          mkdir -p /tmp/ai/local-transcriber/runtime /tmp/ai/local-transcriber/recordings /tmp/models/talk-to-type/pyannote
          cp .env.example /tmp/ai/local-transcriber/app.env
          AI_HOME=/tmp/ai \
          MODELS_DIR=/tmp/models \
          LOCAL_TRANSCRIBER_DIR="$PWD" \
          T4_UUID=GPU-test \
          LLAMA_SWAP_KEY=sk-local \
          docker compose \
            -f tests/fixtures/ai-stack-base.yml \
            -f deploy/ai-stack/compose.override.yml \
            config -q
      - run: docker build -t local-transcriber-ci .

# Talk to Type integration for the existing ai-stack Compose project.
#
# Install with:
#   python /home/dan/ai/local-transcriber/deploy/ai-stack/install.py
#
# The installer symlinks this file to /home/dan/ai/compose.override.yml so the
# normal "cd /home/dan/ai && docker compose ..." commands include these services.

services:
  llama-swap-t4:
    volumes:
      - type: bind
        source: ${LOCAL_TRANSCRIBER_DIR:-/home/dan/ai/local-transcriber}/runtime
        target: /run/talk-to-type
      - type: bind
        source: ${LOCAL_TRANSCRIBER_DIR:-/home/dan/ai/local-transcriber}/deploy/ai-stack/speaker-stop.sh
        target: /scripts/speaker-stop.sh
        read_only: true

  local-transcriber:
    build:
      context: ${LOCAL_TRANSCRIBER_DIR:-/home/dan/ai/local-transcriber}
    container_name: local-transcriber
    env_file:
      - ${LOCAL_TRANSCRIBER_DIR:-/home/dan/ai/local-transcriber}/.env
    environment:
      SPEAKER_SERVICE_URL: http://speaker-analyzer:9000
      SPEAKER_SWAP_URL: http://llama-swap-t4:8080
      SPEAKER_SWAP_MODEL: speaker_auto
      SPEAKER_SWAP_KEY: ${LLAMA_SWAP_KEY:-sk-local}
      SPEAKER_RESTORE_PREVIOUS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${LOCAL_TRANSCRIBER_DIR:-/home/dan/ai/local-transcriber}/recordings:/data/recordings
    ports:
      - "8090:8080"
    depends_on:
      - speaker-analyzer
      - llama-swap-t4
    restart: unless-stopped
    networks: [ai]

  speaker-analyzer:
    build:
      context: ${LOCAL_TRANSCRIBER_DIR:-/home/dan/ai/local-transcriber}/speaker_service
    env_file:
      - ${LOCAL_TRANSCRIBER_DIR:-/home/dan/ai/local-transcriber}/.env
    environment:
      HF_HOME: /models
      GATEWAY_BASE_URL: http://host.docker.internal:8555/v1
      PYANNOTE_MODEL: ${PYANNOTE_MODEL:-pyannote/speaker-diarization-community-1}
      SPEAKER_DEVICE: cuda
      SPEAKER_BUSY_FILE: /run/talk-to-type/speaker.busy
      NVIDIA_VISIBLE_DEVICES: ${T4_UUID}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MODELS_DIR:-/databases/aimodels}/talk-to-type/pyannote:/models
      - ${LOCAL_TRANSCRIBER_DIR:-/home/dan/ai/local-transcriber}/runtime:/run/talk-to-type
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${T4_UUID}"]
              capabilities: [gpu]
    restart: unless-stopped
    networks: [ai]

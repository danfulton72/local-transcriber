# Standalone/development Compose. The R720 production deployment uses
# deploy/ai-stack/compose.override.yml inside the existing ai-stack project.

services:
  local-transcriber:
    build: .
    container_name: local-transcriber
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./recordings:/data/recordings
    ports:
      - "8090:8080"
    depends_on:
      - speaker-analyzer
    restart: unless-stopped

  speaker-analyzer:
    build:
      context: ./speaker_service
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /models
      PYANNOTE_MODEL: ${PYANNOTE_MODEL:-pyannote/speaker-diarization-community-1}
      SPEAKER_DEVICE: ${SPEAKER_DEVICE:-cuda}
      GATEWAY_BASE_URL: http://host.docker.internal:8555/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./speaker-model-cache:/models
    gpus: all
    restart: unless-stopped
